<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NER Extractor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;500;700&display=swap');

    :root {
      --bg: #0d0f14;
      --surface: #161920;
      --border: #2a2d38;
      --accent: #00e5ff;
      --accent2: #ff6b6b;
      --accent3: #a8ff78;
      --text: #e8ecf0;
      --muted: #6b7280;
      --tag-bg: #1e2230;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      min-height: 200px;
      max-height: 600px;
      overflow-y: auto;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .logo-text {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--muted);
      font-weight: 300;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--accent3); box-shadow: 0 0 6px var(--accent3); }
    .status-dot.error { background: var(--accent2); }

    .body { padding: 12px 16px; }

    #scan-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #00b4d8, #00e5ff);
      color: #0d0f14;
      border: none;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    #scan-btn:hover { opacity: 0.9; }
    #scan-btn:active { transform: scale(0.98); }
    #scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #status-msg {
      text-align: center;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      min-height: 14px;
    }

    .results { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .card-header .dot {
      width: 6px; height: 6px; border-radius: 50%;
    }

    .brand-header .dot { background: var(--accent); }
    .price-header .dot { background: var(--accent3); }
    .discount-header .dot { background: #ffb347; }
    .urgency-header .dot { background: var(--accent2); }
    .other-header .dot { background: #c084fc; }

    .card-body { padding: 10px 12px; }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }

    .tag.brand { border-color: rgba(0,229,255,0.3); color: var(--accent); }
    .tag.price { border-color: rgba(168,255,120,0.3); color: var(--accent3); }
    .tag.discount { border-color: rgba(255,179,71,0.3); color: #ffb347; }
    .tag.urgency { border-color: rgba(255,107,107,0.3); color: var(--accent2); }
    .tag.other { border-color: rgba(192,132,252,0.3); color: #c084fc; }

    .confidence {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      opacity: 0.6;
    }

    .empty { color: var(--muted); font-size: 11px; font-style: italic; }

    .raw-toggle {
      margin-top: 8px;
      text-align: right;
    }
    .raw-toggle button {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
    }
    .raw-toggle button:hover { color: var(--text); }

    #raw-json {
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--accent2);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <div>
        <div class="logo-text">NER EXTRACTOR</div>
        <div class="logo-sub">E-Commerce Entity Recognition</div>
      </div>
    </div>
    <div id="status-dot" class="status-dot" title="Backend status"></div>
  </div>

  <div class="body">
    <button id="scan-btn">⚡ SCAN THIS PAGE</button>
    <div id="status-msg">Ready — make sure backend is running on port 5000</div>

    <div id="results" class="results" style="display:none;"></div>

    <div class="raw-toggle" id="raw-toggle" style="display:none;">
      <button id="raw-btn">{ } raw json</button>
    </div>
    <pre id="raw-json"></pre>
  </div>

  <script src="popup.js"></script>
</body>
</html>
